<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shape Siege</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; user-select: none; }
    body { background: #050505; color: #FFF; overflow: hidden; }
    canvas#canvas { display: block; position: absolute; top:0; left:0; z-index:1; }
    canvas#minimap { position: absolute; top: 1rem; right: 1rem; border: 2px solid #38BDF8; border-radius: 0.5rem; background: rgba(15,23,42,0.8); z-index: 50; }
    .hidden { display: none !important; }
    .ui-layer { position: absolute; top:0; left:0; width:100%; height:100%; z-index:100; display:flex; align-items:center; justify-content:center; background: rgba(15,23,42,0.9); flex-direction:column; }
    .panel { background: rgba(2,6,23,0.8); border: 1px solid #38BDF8; padding: 2rem; border-radius: 1rem; text-align: center; }
    input, .btn { width: 100%; padding: 1rem; margin-top: 1rem; border-radius: 0.5rem; font-size: 1.2rem; }
    .btn { background: #38BDF8; border: none; font-weight: bold; cursor: pointer; color: #000; }
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; padding: 1rem; }
    .team-member { background: rgba(15,23,42,0.8); padding: 1rem; border-left: 4px solid #38BDF8; margin-bottom: 0.5rem; width: 250px; }
    .hp-bg { background: #000; height: 10px; margin-top: 5px; } .hp-fill { background: #10B981; height: 100%; }
    .cards { display: flex; gap: 1rem; margin-top: 2rem; }
    .card { background: #1E293B; border: 2px solid #38BDF8; padding: 2rem; border-radius: 1rem; cursor: pointer; pointer-events: auto; }
  </style>
</head>
<body>
  <div id="lobby" class="ui-layer">
    <div class="panel">
      <h1 style="color:#38BDF8; font-size: 3rem;">SHAPE SIEGE</h1>
      <input type="text" id="username" placeholder="Name">
      <input type="text" id="roomCode" placeholder="Room Code (Blank for new)">
      <button class="btn" onclick="joinRoom()">JOIN SQUAD</button>
      <div id="players" style="margin-top:1rem; font-size: 1.2rem;"></div>
      <button class="btn hidden" id="startBtn" onclick="socket.emit('startGame', roomId)">START</button>
    </div>
  </div>

  <div id="cardOverlay" class="ui-layer hidden">
    <h1 style="color:#F59E0B; font-size:3rem;">WAVE CLEARED</h1>
    <div class="cards" id="cardsBox"></div>
  </div>

  <div id="gameOver" class="ui-layer hidden">
    <h1 style="color:#EF4444; font-size:4rem;">WIPED</h1>
    <h2 id="finalWave"></h2>
  </div>

  <div id="hud" class="hidden">
    <div id="teamUI"></div>
    <div style="position:absolute; top:1rem; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); padding:1rem; border-bottom:4px solid #F59E0B;">
      <h2 style="color:#F59E0B; margin:0; font-size:2rem;">WAVE <span id="waveDisp">1</span></h2>
    </div>
    <div style="position:absolute; bottom:2rem; left:50%; transform:translateX(-50%); width:400px; text-align:center;">
      <h3 style="color:#38BDF8;">STAMINA</h3>
      <div class="hp-bg"><div id="stam-fill" style="background:#38BDF8; height:100%; width:100%;"></div></div>
    </div>
  </div>

  <canvas id="canvas"></canvas>
  <canvas id="minimap" width="200" height="200" class="hidden"></canvas>

  <script>
    const socket = io(), canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const minimap = document.getElementById('minimap'), mCtx = minimap.getContext('2d');
    let roomId = null, myId = null, state = { players:{}, enemies:[], bullets:[] }, pings = [];
    let localPlayer = { x:3000, y:3000, stamina:100, maxStamina:100 };
    let keys = {w:false, a:false, s:false, d:false, shift:false, ' ':false}, mouse = {x:0, y:0, left:false, right:false};

    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }; window.onresize();

    function joinRoom() {
      roomId = document.getElementById('roomCode').value.toUpperCase() || Math.random().toString(36).substr(2,4).toUpperCase();
      socket.emit('joinRoom', { roomId, username: document.getElementById('username').value||'Player' });
    }

    socket.on('updateLobby', (players) => {
      myId = socket.id; if(players.find(p=>p.id===myId)?.isHost) document.getElementById('startBtn').classList.remove('hidden');
      document.getElementById('players').innerHTML = players.map(p=>`<div>${p.name} ${p.isHost?'👑':''}</div>`).join('');
    });

    socket.on('gameStarted', () => { document.getElementById('lobby').classList.add('hidden'); document.getElementById('hud').classList.remove('hidden'); minimap.classList.remove('hidden'); });
    socket.on('gameState', (data) => { state = data; if(state.players[myId]){ localPlayer.stamina=state.players[myId].stamina; localPlayer.maxStamina=state.players[myId].maxStamina; } updateHUD(); });
    socket.on('resumeWave', (w) => { document.getElementById('cardOverlay').classList.add('hidden'); document.getElementById('waveDisp').innerText=w.wave; });
    socket.on('showCards', (c) => { document.getElementById('cardsBox').innerHTML = c.map(card=>`<div class="card" onclick="socket.emit('selectCard',{roomId:'${roomId}',cardId:'${card.id}'});document.getElementById('cardOverlay').classList.add('hidden');"><h2 style="color:#38BDF8">${card.name}</h2><p style="color:#FFF">${card.desc}</p></div>`).join(''); document.getElementById('cardOverlay').classList.remove('hidden'); });
    socket.on('mapPinged', (p) => pings.push({x:p.x, y:p.y, life:60}));
    socket.on('gameOver', (w) => { document.getElementById('gameOver').classList.remove('hidden'); document.getElementById('finalWave').innerText = "Survived to Wave " + w; });

    window.onkeydown = e => keys[e.key.toLowerCase()] = true; window.onkeyup = e => keys[e.key.toLowerCase()] = false;
    window.onmousemove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
    window.onmousedown = e => { if(e.button===0) mouse.left=true; if(e.button===2) socket.emit('pingMap', {roomId, x:localPlayer.x+(mouse.x-canvas.width/2), y:localPlayer.y+(mouse.y-canvas.height/2)}); };
    window.onmouseup = e => { if(e.button===0) mouse.left=false; }; window.oncontextmenu = e => e.preventDefault();

    let lastTime = performance.now();
    function gameLoop(t) {
      let dt = (t - lastTime)/1000; lastTime = t;
      if (roomId && state.players[myId] && !state.players[myId].dead && !state.players[myId].knocked && !document.getElementById('hud').classList.contains('hidden')) {
        let dx=0, dy=0; if(keys.w) dy-=1; if(keys.s) dy+=1; if(keys.a) dx-=1; if(keys.d) dx+=1;
        let speed = state.players[myId].stats.spd*60*dt; if(keys.shift && localPlayer.stamina>0) speed*=1.5;
        let len = Math.hypot(dx,dy); if(len>0){ localPlayer.x+=(dx/len)*speed; localPlayer.y+=(dy/len)*speed; }
        localPlayer.x = Math.max(20, Math.min(5980, localPlayer.x)); localPlayer.y = Math.max(20, Math.min(5980, localPlayer.y));
        socket.emit('playerInput', { roomId, dx, dy, angle: Math.atan2(mouse.y-canvas.height/2, mouse.x-canvas.width/2), isShooting: mouse.left, isDashing: keys[' '], isSprinting: keys.shift });
      }
      render(); requestAnimationFrame(gameLoop);
    } requestAnimationFrame(gameLoop);

    function updateHUD() {
      if(!state.players[myId]) return;
      document.getElementById('teamUI').innerHTML = Object.values(state.players).map(p=>`<div class="team-member"><div style="font-weight:bold">${p.name} ${p.knocked?'<span style="color:#F59E0B">(KNOCKED)</span>':''}</div><div class="hp-bg"><div class="hp-fill" style="width:${Math.max(0,p.hp/p.maxHp*100)}%; background:${p.knocked?'#EF4444':'#10B981'}"></div></div></div>`).join('');
      document.getElementById('stam-fill').style.width = `${Math.max(0, localPlayer.stamina/localPlayer.maxStamina*100)}%`;

      mCtx.clearRect(0,0,200,200); let s = 200/6000;
      state.enemies.forEach(e=>{ mCtx.fillStyle='#EF4444'; mCtx.beginPath(); mCtx.arc(e.x*s, e.y*s, 2, 0, Math.PI*2); mCtx.fill(); });
      Object.values(state.players).forEach(p=>{ if(p.dead)return; mCtx.fillStyle = p.id===myId?'#38BDF8':'#10B981'; mCtx.beginPath(); mCtx.arc(p.x*s, p.y*s, 3, 0, Math.PI*2); mCtx.fill(); });
    }

    function render() {
      ctx.fillStyle='#050505'; ctx.fillRect(0,0,canvas.width,canvas.height);
      if(!state.players[myId]) return;
      const camX = localPlayer.x - canvas.width/2, camY = localPlayer.y - canvas.height/2;
      ctx.strokeStyle='#1E293B'; ctx.lineWidth=2; for(let x=-camX%100; x<canvas.width; x+=100){ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();} for(let y=-camY%100; y<canvas.height; y+=100){ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();}
      ctx.strokeStyle='#38BDF8'; ctx.lineWidth=5; ctx.strokeRect(-camX,-camY,6000,6000);

      for(let i=pings.length-1; i>=0; i--){ pings[i].life--; ctx.strokeStyle='#38BDF8'; ctx.beginPath(); ctx.arc(pings[i].x-camX, pings[i].y-camY, 30-(pings[i].life/2), 0, Math.PI*2); ctx.stroke(); if(pings[i].life<=0) pings.splice(i,1); }
      state.bullets.forEach(b=>{ ctx.fillStyle=b.type==='ENEMY'?'#EF4444':(b.element==='FIRE'?'#F97316':(b.element==='ICE'?'#38BDF8':'#FFF')); ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, b.type==='PLAYER'?5:7, 0, Math.PI*2); ctx.fill(); });
      state.enemies.forEach(e=>{
        ctx.save(); ctx.translate(e.x-camX, e.y-camY); ctx.fillStyle=e.status==='ICE'?'#38BDF8':(e.status==='FIRE'?'#F97316':(e.type==='SPLITTER'?'#F59E0B':(e.type==='SNIPER'?'#EC4899':'#EF4444')));
        if(e.type==='SPLITTER'){ ctx.beginPath(); for(let i=0;i<6;i++) ctx.lineTo(e.size*Math.cos(i*Math.PI/3), e.size*Math.sin(i*Math.PI/3)); ctx.fill(); } else if(e.type==='SNIPER'){ ctx.rotate(e.aimAngle||0); ctx.fillRect(-12,-12,24,24); } else { ctx.rotate(Math.atan2(localPlayer.y-e.y, localPlayer.x-e.x)); ctx.beginPath(); ctx.moveTo(e.size,0); ctx.lineTo(-e.size,e.size); ctx.lineTo(-e.size,-e.size); ctx.fill(); }
        ctx.fillStyle='#000'; ctx.fillRect(-15,-e.size-10,30,4); ctx.fillStyle='#EF4444'; ctx.fillRect(-15,-e.size-10,30*Math.max(0,e.hp/e.maxHp),4); ctx.restore();
      });
      Object.values(state.players).forEach(p=>{
        if(p.dead) return; let rx = p.id===myId?localPlayer.x:p.x, ry = p.id===myId?localPlayer.y:p.y;
        ctx.save(); ctx.translate(rx-camX, ry-camY);
        if(p.knocked){ ctx.fillStyle='#EF4444'; ctx.fillRect(-15,-15,30,30); } else { ctx.rotate(p.id===myId?Math.atan2(mouse.y-canvas.height/2, mouse.x-canvas.width/2):p.angle); ctx.fillStyle=p.id===myId?'#38BDF8':'#10B981'; ctx.fillRect(-15,-15,30,30); ctx.fillStyle='#FFF'; ctx.fillRect(15,-3,15,6); }
        ctx.restore();
      });
    }
  </script>
</body>
</html>
