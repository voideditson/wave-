<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shape Siege: Zenith</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Rajdhani:wght@600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; user-select: none; }
    body { background: #050505; color: #FFF; overflow: hidden; }
    canvas { display: block; }
    .hidden { display: none !important; }
    .shake { animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-2px, 2px, 0); } 20%, 80% { transform: translate3d(4px, -4px, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 6px, 0); } }

    /* MODERN UI OVERHAUL */
    .glass-panel { background: rgba(10, 15, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 1rem; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
    
    #lobby-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #0F172A, #020617); z-index: 100; }
    .lobby-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 1000px; width: 90%; padding: 3rem; }
    
    .title-section h1 { font-family: 'Chakra Petch', sans-serif; font-size: 5rem; color: #38BDF8; line-height: 1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 20px rgba(56,189,248,0.5); }
    .title-section p { font-size: 1.5rem; color: #94A3B8; margin-bottom: 2rem; }
    
    input { width: 100%; padding: 1.2rem; font-size: 1.2rem; border-radius: 0.5rem; border: 1px solid #334155; margin-bottom: 1rem; background: rgba(0,0,0,0.5); color: white; transition: 0.3s; }
    input:focus { border-color: #38BDF8; outline: none; box-shadow: 0 0 15px rgba(56,189,248,0.2); }
    
    .btn { background: linear-gradient(45deg, #2563EB, #8B5CF6); color: #FFF; border: none; padding: 1.2rem; font-size: 1.5rem; font-family: 'Chakra Petch', sans-serif; font-weight: bold; border-radius: 0.5rem; cursor: pointer; transition: 0.2s; width: 100%; text-transform: uppercase; letter-spacing: 1px; }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(139, 92, 246, 0.5); }

    .player-slot { background: rgba(0,0,0,0.4); padding: 1rem; border-left: 4px solid #38BDF8; margin-bottom: 0.5rem; border-radius: 0.5rem; font-size: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    
    /* HUD */
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    .team-container { display: flex; flex-direction: column; gap: 0.5rem; }
    .team-member { background: rgba(15, 23, 42, 0.8); padding: 0.8rem 1.2rem; border-radius: 0.5rem; border-left: 4px solid #38BDF8; width: 280px; backdrop-filter: blur(5px); }
    .tm-name { font-size: 1.2rem; display: flex; justify-content: space-between; font-weight: bold; }
    .tm-hp-bg { background: #1E293B; height: 12px; border-radius: 6px; margin-top: 8px; overflow: hidden; border: 1px solid #000; }
    .tm-hp-fill { background: linear-gradient(90deg, #10B981, #34D399); height: 100%; transition: width 0.2s ease-out; }

    .wave-display { background: rgba(15,23,42,0.8); padding: 1rem 3rem; border-radius: 0.5rem; border-bottom: 4px solid #F59E0B; text-align: center; }
    .wave-display h2 { font-family: 'Chakra Petch', sans-serif; font-size: 3rem; margin: 0; color: #F59E0B; line-height: 1; }
    
    .stamina-bar-container { position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); width: 400px; text-align: center; }
    .stam-bg { background: #1E293B; height: 16px; border-radius: 8px; overflow: hidden; border: 2px solid #0F172A; }
    #stam-fill { background: linear-gradient(90deg, #38BDF8, #818CF8); height: 100%; box-shadow: 0 0 10px #38BDF8; }

    .cards-container { display: flex; gap: 1.5rem; justify-content: center; margin-top: 2rem; }
    .upgrade-card { background: #1E293B; border: 2px solid #38BDF8; padding: 2rem; border-radius: 1rem; cursor: pointer; width: 220px; pointer-events: auto; transition: 0.2s; text-align: center; }
    .upgrade-card:hover { transform: translateY(-10px); background: #334155; box-shadow: 0 10px 30px rgba(56,189,248,0.3); }
    
    #weather-overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 5; transition: opacity 2s; background: rgba(200,200,200,0.3); opacity: 0; backdrop-filter: blur(2px); }
  </style>
</head>
<body>

  <!-- NEW UI LOBBY -->
  <div id="lobby-ui">
    <div class="lobby-grid glass-panel" id="join-section">
      <div class="title-section">
        <h1>SHAPE SIEGE</h1>
        <p>Tactical Wave Survival</p>
        <div style="color: #10B981; font-weight: bold; margin-bottom: 1rem;">&#10003; Engine v3 Active (Zero-Lag Predictor)</div>
      </div>
      <div>
        <input type="text" id="username" placeholder="OPERATIVE NAME" maxlength="12">
        <input type="text" id="roomCode" placeholder="SQUAD CODE (Optional)" style="text-transform:uppercase">
        <button class="btn" onclick="joinRoom()">DEPLOY SQUAD</button>
      </div>
    </div>

    <div class="lobby-grid glass-panel hidden" id="waiting-section" style="display: block; text-align: center; max-width: 600px;">
      <h2 style="font-size: 2.5rem; color: #F59E0B; margin-bottom: 1rem; font-family: 'Chakra Petch', sans-serif;">SQUAD HUB: <span id="displayRoom"></span></h2>
      <div id="lobbyPlayers" style="margin-bottom: 2rem; text-align: left;"></div>
      <button class="btn hidden" id="startBtn" onclick="socket.emit('startGame', roomId)">INITIATE SIEGE</button>
    </div>
  </div>

  <div class="glass-panel hidden" id="cardOverlay" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:200; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(2,6,23,0.95); border:none; border-radius:0;">
    <h1 style="color:#F59E0B; font-family:'Chakra Petch', sans-serif; font-size:4rem;">SYSTEM UPGRADE AVAILABLE</h1>
    <div class="cards-container" id="cardsBox"></div>
  </div>

  <div id="weather-overlay"></div>

  <div id="hud" class="hidden">
    <div class="top-bar">
      <div class="team-container" id="teamUI"></div>
      <div class="wave-display">
        <h2>WAVE <span id="waveDisp">1</span></h2>
        <div id="weatherDisp" style="color:#94A3B8; font-weight:bold; letter-spacing:2px;">CLEAR</div>
      </div>
      <div style="width:280px"></div> <!-- Spacer for layout -->
    </div>
    
    <div class="stamina-bar-container">
      <div style="color:#38BDF8; font-weight:bold; letter-spacing:2px; margin-bottom:0.5rem; text-shadow: 0 0 5px #38BDF8;">EXO-STAMINA</div>
      <div class="stam-bg"><div id="stam-fill" style="width:100%"></div></div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const socket = io();
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let roomId = null, myId = null;
    
    // Engine State
    let state = { players: {}, enemies: [], bullets: [], traps: [] };
    let localPlayer = { x: 3000, y: 3000, stamina: 100 }; // For Client-Side Prediction
    let pings = [], floatingTexts = [], trails = [];
    
    let keys = { w:false, a:false, s:false, d:false, shift:false, ' ':false };
    let mouse = { x: window.innerWidth/2, y: window.innerHeight/2, down: false };

    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    window.dispatchEvent(new Event('resize'));

    function joinRoom() {
      roomId = document.getElementById('roomCode').value.toUpperCase() || Math.random().toString(36).substr(2, 4).toUpperCase();
      socket.emit('joinRoom', { roomId, username: document.getElementById('username').value || 'Operative' });
      document.getElementById('join-section').classList.add('hidden');
      document.getElementById('waiting-section').classList.remove('hidden');
      document.getElementById('displayRoom').innerText = roomId;
    }

    socket.on('updateLobby', (players) => {
      myId = socket.id;
      if (players.find(p => p.id === myId)?.isHost) document.getElementById('startBtn').classList.remove('hidden');
      document.getElementById('lobbyPlayers').innerHTML = players.map(p => `<div class="player-slot">${p.name} <span>${p.isHost ? '👑' : '🟢'}</span></div>`).join('');
    });

    socket.on('gameStarted', () => {
      document.getElementById('lobby-ui').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
    });

    socket.on('gameState', (data) => {
      state = data;
      // Reconcile non-local players and sync local stamina
      if (state.players[myId]) {
        localPlayer.stamina = state.players[myId].stamina;
        localPlayer.maxStamina = state.players[myId].maxStamina;
      }
      updateUI();
    });

    socket.on('waveAdvanced', ({ wave, weather }) => {
      document.getElementById('waveDisp').innerText = wave;
      document.getElementById('weatherDisp').innerText = weather;
      document.getElementById('weather-overlay').style.opacity = weather === 'FOG' ? '1' : '0';
    });
    
    socket.on('resumeWave', (w) => { document.getElementById('cardOverlay').classList.add('hidden'); document.getElementById('waveDisp').innerText = w; });
    socket.on('showCards', (cards) => {
      document.getElementById('cardsBox').innerHTML = cards.map(c => `
        <div class="upgrade-card" onclick="socket.emit('selectCard', { roomId: '${roomId}', cardId: '${c.id}' }); document.getElementById('cardOverlay').classList.add('hidden');">
          <h3 style="color:#38BDF8; font-family:'Chakra Petch'; font-size:2rem;">${c.name}</h3><p style="color:#94A3B8; font-size:1.2rem;">${c.desc}</p>
        </div>`).join('');
      document.getElementById('cardOverlay').classList.remove('hidden');
    });

    socket.on('screenShake', () => { document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 200); });
    socket.on('floatingText', (t) => floatingTexts.push({ x: t.x, y: t.y, text: t.text, color: t.color, life: 30, vy: -2 }));
    socket.on('mapPinged', (p) => pings.push({ x: p.x, y: p.y, color: p.color, life: 60 }));

    window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mousedown', (e) => {
      if (e.button === 2) { socket.emit('pingMap', { roomId, x: localPlayer.x + (mouse.x - canvas.width/2), y: localPlayer.y + (mouse.y - canvas.height/2) }); }
      else mouse.down = true; 
    });
    window.addEventListener('mouseup', () => mouse.down = false);
    window.addEventListener('contextmenu', e => e.preventDefault());

    // --- CLIENT-SIDE PREDICTION LOOP ---
    // Runs at monitor refresh rate (60/144hz) instead of 30hz setInterval for zero clunkiness
    let lastTime = performance.now();
    function gameLoop(time) {
      const dt = (time - lastTime) / 1000;
      lastTime = time;

      if (roomId && state.players[myId] && !state.players[myId].dead && !state.players[myId].knocked && !document.getElementById('hud').classList.contains('hidden')) {
        let dx = 0, dy = 0;
        if (keys.w) dy -= 1; if (keys.s) dy += 1;
        if (keys.a) dx -= 1; if (keys.d) dx += 1;
        
        let speed = state.players[myId].stats.spd * 60 * dt; // Normalized speed
        if (keys.shift && localPlayer.stamina > 0) speed *= 1.6;

        let len = Math.hypot(dx, dy);
        if (len > 0) { localPlayer.x += (dx / len) * speed; localPlayer.y += (dy / len) * speed; }
        
        localPlayer.x = Math.max(20, Math.min(6000 - 20, localPlayer.x));
        localPlayer.y = Math.max(20, Math.min(6000 - 20, localPlayer.y));
        const angle = Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2);

        socket.emit('playerInput', { roomId, x: localPlayer.x, y: localPlayer.y, angle, isShooting: mouse.down, isDashing: keys[' '], ts: Date.now() });
      }

      render();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    function updateUI() {
      if(!state.players[myId]) return;
      document.getElementById('teamUI').innerHTML = Object.values(state.players).map(p => {
        const hpPct = (p.hp / p.maxHp) * 100;
        let status = p.dead ? '<span style="color:#EF4444">DEAD</span>' : (p.knocked ? `<span style="color:#F59E0B">KNOCKED</span>` : '');
        return `
          <div class="team-member">
            <div class="tm-name"><span>${p.name}</span> ${status}</div>
            <div class="tm-hp-bg"><div class="tm-hp-fill" style="width:${hpPct}%; background:${p.knocked ? '#EF4444' : ''}"></div></div>
          </div>`;
      }).join('');
      document.getElementById('stam-fill').style.width = `${(localPlayer.stamina / (localPlayer.maxStamina||100)) * 100}%`;
    }

    function render() {
      ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      const srvMe = state.players[myId];
      if (!srvMe) return;

      const camX = localPlayer.x - canvas.width / 2, camY = localPlayer.y - canvas.height / 2;

      // Grid
      ctx.strokeStyle = '#1E293B'; ctx.lineWidth = 2;
      for(let x = -camX % 100; x < canvas.width; x+=100) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
      for(let y = -camY % 100; y < canvas.height; y+=100) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

      ctx.strokeStyle = '#38BDF8'; ctx.lineWidth = 5; ctx.strokeRect(-camX, -camY, 6000, 6000);

      // Traps
      state.traps.forEach(t => {
        ctx.fillStyle = '#F59E0B'; ctx.beginPath(); ctx.arc(t.x - camX, t.y - camY, 10, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)'; ctx.beginPath(); ctx.arc(t.x - camX, t.y - camY, 20 + Math.sin(Date.now()/100)*5, 0, Math.PI*2); ctx.stroke();
      });

      // Pings
      for (let i = pings.length - 1; i >= 0; i--) {
        let p = pings[i]; p.life--;
        ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.globalAlpha = p.life / 60;
        ctx.beginPath(); ctx.arc(p.x - camX, p.y - camY, 30 - (p.life/2), 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
        if (p.life <= 0) pings.splice(i, 1);
      }

      state.enemies.forEach(e => {
        if (e.type === 'SNIPER' && e.chargeTimer > 0) {
          ctx.beginPath(); ctx.moveTo(e.x - camX, e.y - camY); ctx.lineTo((e.x - camX) + Math.cos(e.aimAngle)*1500, (e.y - camY) + Math.sin(e.aimAngle)*1500);
          ctx.strokeStyle = `rgba(239, 68, 68, ${e.chargeTimer / 60})`; ctx.lineWidth = 3; ctx.stroke();
        }
        ctx.save(); ctx.translate(e.x - camX, e.y - camY);
        ctx.fillStyle = e.status === 'ICE' ? '#38BDF8' : (e.status === 'FIRE' ? '#F97316' : (e.type === 'SPLITTER' ? '#F59E0B' : (e.type === 'SNIPER' ? '#EC4899' : '#EF4444')));
        if (e.type === 'SPLITTER') { ctx.beginPath(); for(let i=0; i<6; i++) { ctx.lineTo(e.size*Math.cos(i*Math.PI/3), e.size*Math.sin(i*Math.PI/3)); } ctx.closePath(); ctx.fill(); }
        else if (e.type === 'SNIPER') { ctx.rotate(e.aimAngle || 0); ctx.fillRect(-12, -12, 24, 24); }
        else { ctx.rotate(Math.atan2(localPlayer.y - e.y, localPlayer.x - e.x)); ctx.beginPath(); ctx.moveTo(e.size, 0); ctx.lineTo(-e.size, e.size); ctx.lineTo(-e.size, -e.size); ctx.closePath(); ctx.fill(); }
        ctx.fillStyle = '#000'; ctx.fillRect(-15, -e.size - 10, 30, 4); ctx.fillStyle = '#EF4444'; ctx.fillRect(-15, -e.size - 10, 30 * (e.hp/e.maxHp), 4);
        ctx.restore();
      });

      state.bullets.forEach(b => {
        ctx.fillStyle = b.type === 'ENEMY' ? '#EF4444' : (b.element === 'FIRE' ? '#F97316' : (b.element === 'ICE' ? '#38BDF8' : '#FFF'));
        ctx.beginPath(); ctx.arc(b.x - camX, b.y - camY, b.type === 'PLAYER' ? 5 : 7, 0, Math.PI*2); ctx.fill();
      });

      Object.values(state.players).forEach(p => {
        if(p.dead) return;
        const renderX = p.id === myId ? localPlayer.x : p.x;
        const renderY = p.id === myId ? localPlayer.y : p.y;
        
        ctx.save(); ctx.translate(renderX - camX, renderY - camY);
        if (p.knocked) { ctx.fillStyle = '#EF4444'; ctx.globalAlpha = 0.5 + Math.sin(Date.now()/150)*0.5; ctx.fillRect(-15, -15, 30, 30); ctx.globalAlpha = 1; }
        else { ctx.rotate(p.id === myId ? Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2) : p.angle); ctx.fillStyle = p.id === myId ? '#38BDF8' : '#10B981'; ctx.fillRect(-15, -15, 30, 30); ctx.fillStyle = '#FFF'; ctx.fillRect(15, -3, 15, 6); }
        ctx.restore();
        if (!p.knocked) { ctx.fillStyle = '#FFF'; ctx.font = 'bold 18px Rajdhani'; ctx.textAlign = 'center'; ctx.fillText(p.name, renderX - camX, renderY - camY - 25); }
      });

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i]; ft.y += ft.vy; ft.life--;
        ctx.fillStyle = ft.color; ctx.globalAlpha = ft.life / 30; ctx.font = 'bold 26px Chakra Petch'; ctx.textAlign = 'center'; ctx.fillText(ft.text, ft.x - camX, ft.y - camY); ctx.globalAlpha = 1;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }
  </script>
</body>
</html>
